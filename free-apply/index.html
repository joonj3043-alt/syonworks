<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#eef7ff">
<title>무료제작 신청 | SYON WORKS</title>
<meta name="description" content="우리 가게 홈페이지, 무료로 만들어 보세요. 성함과 연락처만 입력해 주세요.">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<style>
:root{font-family:Pretendard,"Noto Sans KR","Apple SD Gothic Neo",Arial,sans-serif;color:#091c43;letter-spacing:-.035em}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(135deg,#edf7ff,#f8fbff 60%,#e8f4ff);padding:clamp(20px,5vw,70px) 18px 45px}
.card{max-width:850px;margin:0 auto;background:white;border-radius:22px;padding:clamp(26px,6vw,65px);box-shadow:0 8px 40px #153a6a0b}
h1{font-size:clamp(32px,5.6vw,58px);font-weight:850;line-height:1.15;margin:0 0 26px;letter-spacing:-.055em}
.lead{font-size:clamp(17px,2.5vw,25px);line-height:1.65;margin:0 0 43px;word-break:keep-all}
.field{display:block;margin-bottom:28px;font-weight:800;font-size:clamp(18px,2.4vw,25px)}
.field input{display:block;margin-top:13px;width:100%;height:clamp(60px,10vw,86px);border:1.5px solid #a8b5ce;border-radius:10px;padding:0 22px;font:500 clamp(17px,2.6vw,24px) inherit;color:#091c43;background:white;outline:none;letter-spacing:normal}
.field input:focus{border-color:#0868f7;box-shadow:0 0 0 3px #0066ff19}.field input::placeholder{color:#9aa6be}
.consent{display:flex;gap:14px;align-items:flex-start;margin:28px 0 30px;font-size:clamp(14px,2vw,20px);line-height:1.55}
.consent input{width:24px;height:24px;flex:none;accent-color:#0766f7;margin:2px 0 0}.consent a{color:#0766f7;text-underline-offset:3px}
button.primary{display:block;width:100%;border:0;border-radius:10px;background:#0866f7;color:#fff;min-height:82px;font-family:inherit;font-size:18px;font-weight:700;line-height:1.4;cursor:pointer}
button.primary:hover{background:#0055dc}button.primary:focus-visible{outline:3px solid #082f80;outline-offset:3px}
.foot{text-align:center;color:#71809e;font-size:clamp(13px,1.8vw,17px);margin:21px 0 0}
.result{margin-top:24px;padding:20px;border:1px solid #d9e5fa;border-radius:12px;background:#f7faff}.result[hidden]{display:none}.result p{margin:0 0 12px;line-height:1.6}.result textarea{width:100%;min-height:110px;padding:12px;border:1px solid #becce3;border-radius:7px;resize:vertical}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}.actions a,.actions button{padding:12px 18px;border-radius:8px;font-size:15px;text-decoration:none;cursor:pointer}.actions a{color:white;background:#0866f7}.actions button{background:white;border:1px solid #b2c5e7;color:#091c43}
@media(max-width:500px){.card{border-radius:18px}.consent input{width:21px;height:21px}button.primary{min-height:65px}.lead{margin-bottom:32px}}
.home-link{display:block;margin-top:22px;padding:19px 16px;text-align:center;border:1.5px solid #a8b5ce;border-radius:10px;background:#fff;color:#091c43;font-size:clamp(16px,2.2vw,20px);font-weight:750;text-decoration:none;letter-spacing:normal}.home-link:hover{background:#f4f8ff;border-color:#0866f7}.home-link:focus-visible{outline:3px solid #0866f7;outline-offset:3px}
</style>
</head>
<body>
<main class="card">
<h1>무료제작 신청</h1>
<p class="lead">우리 가게 홈페이지, 무료로 만들어 보세요.<br>성함과 연락처만 입력해 주세요.</p>
<form id="apply-form">
<label class="field">성함<input name="name" required autocomplete="name" maxlength="80" placeholder="예: 홍길동"></label>
<label class="field">연락처<input name="phone" required type="tel" inputmode="tel" autocomplete="tel" maxlength="20" placeholder="예: 010-1234-5678" pattern="[0-9+() .-]{8,20}"></label>
<label class="consent"><input name="consent" type="checkbox" required><span>작성 정보의 처리 안내를 확인했습니다. <a href="../privacy/" target="_blank" rel="noopener noreferrer">보기</a></span></label>
<button class="primary" type="submit">무료제작 신청 남기기</button>
<p class="foot">문자 앱에서 전송 버튼을 눌러 주세요.</p>
<div class="result" id="result" hidden aria-live="polite">
<p>문자 앱에서 전송을 완료해야 신청이 접수됩니다. 문자 앱이 열리지 않으면 아래 내용을 복사해 보내 주세요.</p>
<textarea id="message" readonly aria-label="신청 문자 내용"></textarea>
<div class="actions"><a id="send-sms" href="#">문자 앱 열기 ↗</a><button id="copy" type="button">내용 복사</button></div>
<p id="copy-status" role="status"></p>
</div>
</form>
<a class="home-link" href="../home/">공식 홈페이지로 이동하기 →</a>
</main>
<script>
(()=>{
const form=document.querySelector('#apply-form'),result=document.querySelector('#result'),textarea=document.querySelector('#message'),sms=document.querySelector('#send-sms'),phone='01049685078';
form.addEventListener('submit',event=>{
 event.preventDefault();if(!form.reportValidity())return;
 const name=form.elements.name.value.trim(),contact=form.elements.phone.value.trim();
 if(!name){form.elements.name.setCustomValidity('성함을 입력해 주세요.');form.reportValidity();return;}
 const digits=contact.replace(/\D/g,'');if(digits.length<8||digits.length>15){form.elements.phone.setCustomValidity('연락처를 확인해 주세요.');form.reportValidity();return;}
 const text=`[SYON WORKS 무료제작 신청]\n성함: ${name}\n연락처: ${contact}`;
 textarea.value=text;
 sms.href=`sms:${phone}${/iPad|iPhone|iPod/.test(navigator.userAgent)?'&':'?'}body=${encodeURIComponent(text)}`;
 result.hidden=false;
 // User must tap Send in their own SMS app; the site does not claim submission.
 window.location.href=sms.href;
});
['name','phone'].forEach(key=>form.elements[key].addEventListener('input',()=>{form.elements[key].setCustomValidity('');result.hidden=true;}));
form.elements.consent.addEventListener('change',()=>result.hidden=true);
document.querySelector('#copy').addEventListener('click',async()=>{try{await navigator.clipboard.writeText(textarea.value);document.querySelector('#copy-status').textContent='내용을 복사했습니다.';}catch{textarea.focus();textarea.select();document.querySelector('#copy-status').textContent='내용을 선택했습니다. 복사해서 보내 주세요.';}});
})();
</script>
</body>
</html>
